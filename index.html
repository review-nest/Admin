<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1ED" />
  <title>ANY TASK · Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand big"><span class="brand-mark">AT</span><div><div class="brand-name">ANY TASK</div><div class="brand-sub">Admin Panel</div></div></div>
      <button type="button" id="btn-google" class="btn google">Continue with Google</button>
      <div class="or"><span>or use email</span></div>
      <label class="field"><span>Admin email</span><input id="login-email" type="email" autocomplete="username" required /></label>
      <label class="field"><span>Password</span><input id="login-pass" type="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn primary block" id="btn-login">Log in</button>
      <button type="button" class="link" id="btn-forgot">Forgot password?</button>
      <p id="login-msg" class="login-msg" role="alert"></p>
    </form>
  </div>

  <!-- APP SHELL -->
  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">AT</span><div><div class="brand-name">ANY TASK</div><div class="brand-sub">Admin Panel</div></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot"><div id="me-role" class="muted small"></div><button id="btn-logout" class="btn ghost sm block">Log out</button></div>
    </aside>
    <div id="scrim" class="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn menu-btn" aria-label="Open menu"></button>
        <h1 id="page-title" class="page-title">Overview</h1>
        <div class="top-right"><span id="maint-pill" class="badge warn hidden">Maintenance ON</span><span class="online-dot"></span><span class="small muted hide-sm" id="me-email"></span></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
